name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          # Ephemeral CI-only credentials
          POSTGRES_USER: farmkart_ci
          POSTGRES_PASSWORD: farmkart_ci
          POSTGRES_DB: farmkart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: farmkart_ci
      DB_PASSWORD: farmkart_ci
      DB_NAME: farmkart_test
      DB_SSLMODE: disable
      TEST_DATABASE_URL: postgresql+psycopg2://farmkart_ci:farmkart_ci@localhost:5432/farmkart_test
      JWT_SECRET: testsecretkeywithatleast32characterslongforvalidjwt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: farmkart-api/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./farmkart-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations apply cleanly and match the models
        working-directory: ./farmkart-api
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run Pytest
        working-directory: ./farmkart-api
        run: pytest -q

  mobile:
    name: Mobile lint & typecheck
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
